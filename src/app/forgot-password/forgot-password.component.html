<div class="main">
  <div class="form-container">
    <div class="form-header">
      <h1 class="form-title">Forgot password</h1>
      <p class="form-subtitle">Enter your email address and we'll send you a link to reset your password.</p>
    </div>

    @if (successMessage) {
      <div class="success-message">{{ successMessage }}</div>
      <button type="button" class="submit-button" (click)="goToLogin()">Back to sign in</button>
    } @else {
      <form (ngSubmit)="onSubmit()" #forgotPasswordForm="ngForm">
        @if (errorMessage) {
          <div class="error-message">{{ errorMessage }}</div>
        }

        <div class="form-group">
          <label class="form-label" for="email">Email address</label>
          <input
            type="email"
            id="email"
            class="form-input"
            placeholder="Enter your email"
            [(ngModel)]="email"
            name="email"
            autocomplete="email"
            required
          />
        </div>

        <button type="submit" class="submit-button" [disabled]="isLoading || !forgotPasswordForm.valid">
          {{ isLoading ? 'Sending...' : 'Send reset link' }}
        </button>

        <button type="button" class="back-button" routerLink="/login">Back to sign in</button>
      </form>
    }
  </div>
</div>
