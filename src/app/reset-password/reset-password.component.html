<div class="main">
  <div class="form-container">
    <div class="form-header">
      <h1 class="form-title">Reset password</h1>
    </div>

    @if (successMessage) {
      <div class="success-message">{{ successMessage }}</div>
      <button type="button" class="submit-button" (click)="goToLogin()">Go to sign in</button>
    } @else {
      <form (ngSubmit)="onSubmit()" #resetPasswordForm="ngForm">
        @if (errorMessage) {
          <div class="error-message">{{ errorMessage }}</div>
        }

        <div class="form-group">
          <label class="form-label" for="newPassword">New password</label>
          <div class="password-container">
            <input
              [type]="showNewPassword ? 'text' : 'password'"
              id="newPassword"
              class="form-input"
              [(ngModel)]="newPassword"
              name="newPassword"
              autocomplete="new-password"
              required
            />
            <button type="button" class="password-toggle" (click)="showNewPassword = !showNewPassword">
              {{ showNewPassword ? 'Hide' : 'Show' }}
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirm new password</label>
          <div class="password-container">
            <input
              [type]="showConfirmPassword ? 'text' : 'password'"
              id="confirmPassword"
              class="form-input"
              [(ngModel)]="confirmPassword"
              name="confirmPassword"
              autocomplete="new-password"
              required
            />
            <button type="button" class="password-toggle" (click)="showConfirmPassword = !showConfirmPassword">
              {{ showConfirmPassword ? 'Hide' : 'Show' }}
            </button>
          </div>
        </div>

        <button type="submit" class="submit-button" [disabled]="isLoading || !resetPasswordForm.valid || !token">
          {{ isLoading ? 'Resetting password...' : 'Reset password' }}
        </button>

        <button type="button" class="back-button" routerLink="/login">Back to sign in</button>
      </form>
    }
  </div>
</div>
